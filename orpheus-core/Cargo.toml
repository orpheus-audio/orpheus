[package]
name = "orpheus-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types for Orpheus, a decentralized home audio-over-IP system"
keywords = ["audio", "aes67", "nmos", "multiroom"]
categories = ["multimedia::audio", "network-programming"]

[features]
default = ["alloc", "getrandom"]
# Heap-backed parts such as the jitter buffer.
alloc = []
# Enables `DeviceId::generate()` using the OS random source.
getrandom = ["dep:getrandom"]
# Serialization of the shared types, e.g. `OutputType` in config files.
serde = ["dep:serde"]

[dependencies]
getrandom = { version = "0.4", optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
