[workspace]
resolver = "3"
members = [
    "orpheus-core",
    "orpheus-aes70",
    "orpheus-nmos",
    "orpheus-clock",
    "orpheus-discovery",
    "orpheus-engine",
    "orpheus-pipewire",
    "orpheusd",
    "orpheusctl",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/orpheus-audio/orpheus"

[workspace.dependencies]
orpheus-core = { path = "orpheus-core", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }

# Release build with whole-program optimization: slow to build, for running
# a node for long. `just build optimized` also optimizes for the build machine's
# CPU, so such binaries do not run on other machines.
[profile.optimized]
inherits = "release"
lto = "fat"
codegen-units = 1

# The resampler runs on every packet; unoptimized, it can't keep up with
# streams of many channels, so debug builds optimize it too.
[profile.dev.package]
rubato.opt-level = 3
audioadapter.opt-level = 3
audioadapter-buffers.opt-level = 3
audioadapter-sample.opt-level = 3
