[package]
name = "orpheusd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orpheus node daemon for Linux"
publish = false

[dependencies]
orpheus-core = { workspace = true, features = ["serde"] }
orpheus-aes70 = { path = "../orpheus-aes70" }
orpheus-engine = { path = "../orpheus-engine", features = ["openapi"] }
orpheus-clock = { path = "../orpheus-clock", features = ["openapi"] }
orpheus-discovery = { path = "../orpheus-discovery", features = ["openapi"] }
orpheus-nmos = { path = "../orpheus-nmos" }
orpheus-pipewire = { path = "../orpheus-pipewire" }
serde.workspace = true
socket2 = "0.6"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["axum_extras", "preserve_order"] }
utoipa-axum = "0.3"
timestamped-socket = { version = "0.3", default-features = false }
tower = "0.5"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "normalize-path"] }
orpheus-i18n.workspace = true
zbus = { version = "6", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
