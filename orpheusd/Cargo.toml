[package]
name = "orpheusd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Orpheus node daemon for Linux"
publish = false

[dependencies]
orpheus-core.workspace = true
orpheus-engine = { path = "../orpheus-engine", features = ["openapi"] }
orpheus-clock = { path = "../orpheus-clock" }
orpheus-pipewire = { path = "../orpheus-pipewire" }
serde.workspace = true
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["axum_extras", "preserve_order"] }
utoipa-axum = "0.3"

[dev-dependencies]
tempfile = "3"
