[package]
name = "orpheus-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-independent media engine for Orpheus"
publish = false

[dependencies]
orpheus-core.workspace = true
rtrb = "0.4"
orpheus-clock = { path = "../orpheus-clock" }
getrandom = "0.3"
serde = { workspace = true, optional = true }

[features]
# `Serialize` for the status types.
serde = ["dep:serde"]
