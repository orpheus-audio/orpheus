[package]
name = "orpheus-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-independent media engine for Orpheus"
publish = false

[dependencies]
orpheus-core.workspace = true
rtrb = "0.4"
orpheus-clock = { path = "../orpheus-clock" }
getrandom = "0.4"
rubato = { version = "5", default-features = false }
socket2 = "0.6"
serde = { workspace = true, optional = true }
utoipa = { version = "6", optional = true }

[features]
# `Serialize` for the status types.
serde = ["dep:serde", "orpheus-core/serde"]
# OpenAPI schemas for the status types.
openapi = ["serde", "dep:utoipa"]
