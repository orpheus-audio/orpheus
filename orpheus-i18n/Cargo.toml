[package]
name = "orpheus-i18n"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Texts in the user's language, from Fluent files, for Orpheus"
publish = false

[dependencies]
fluent-bundle = "0.16"
fluent-langneg = "0.13"
fluent-syntax = "0.12"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"
tracing = "0.1"
